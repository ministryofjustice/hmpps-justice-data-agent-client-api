server:
  shutdown: immediate

management.endpoint:
  health.cache.time-to-live: 0
  info.cache.time-to-live: 0

hmpps-auth:
  url: "http://localhost:8090/auth"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${hmpps-auth.url}/.well-known/jwks.json

      client:
        provider:
          hmpps-auth:
            token-uri: ${hmpps-auth.url}/oauth/token
        registration:
          jda-worker-api:
            provider: hmpps-auth
            client-id: "client-id"
            client-secret: "client-secret"
            authorization-grant-type: client_credentials
            scope: read

hmpps:
  sqs:
    enabled: true
    provider: localstack
    localstackUrl: http://localhost:4566
    region: eu-west-2
    queues:
      jdarequestqueues:
        queuename: sqs_request_queue_name
        dlqName: sqs_request_dlq_queue_name
      jdaresponsequeues:
        queuename: sqs_response_queue_name
        dlqName: sqs_response_dlq_queue_name
  jda:
    worker:
      api:
        base-url: http://localhost:8091